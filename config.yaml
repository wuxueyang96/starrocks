type: "bitmap" # [bitmap or delta]
# AWS Configuration
aws:
  region: ""
  endpoint: ""
  access_key_id: "ACCESS_KEY_ID"
  access_key_secret: "ACCESS_KEY_SECRET"

# S3 Configuration
s3:
  bucket_name: "your-bucket-name"
  object_key: "path/to/your/file.parquet"

# Parquet Reader Configuration
# Columns specified by indices (0-based)
parquet:
  # column_indices: [0, 1, 2]  # Specify column indices to read, empty = all columns
  index_output_path: "/tmp/inverted_index.bin"  # Path to save inverted index
  compression: "none"      # Compression algorithm: none, lz4, snappy, zstd
  encoding: "adaptive"     # Encoding type: varint, simple9, for, pfor, newpfor, adaptive (recommended)

tokenizer:
  stop_words: []

memory:
  enable: true
  total_size: 2147483648
  small_block_ratio: 0.7
  enable_logging: false