syntax = "proto2";

package starrocks;
option java_package = "com.starrocks.proto";

message SuffixAutomatonStatePB {
  required int32 len = 1;
  required int32 link = 2;
  map<int32, int32> next = 3;
  required bytes occ = 4;
}

message SuffixAutomatonPB {
  required int32 last = 1;
  repeated SuffixAutomatonStatePB states = 2;
}
